name: MOLIT Weekly Brief

# molit.go.kr이 GitHub 러너(해외 IP)를 차단하므로 Cloudflare Worker
# (molit-proxy, proxy-worker/ 참고)를 경유해 접속한다 (2026-07-11 검증).
# 실패 대비 페일오버: 로컬 launchd가 일·월 09:37에 미발행 시 따라잡음.
on:
  schedule:
    # 매주 토요일 아침 (KST). 다중 cron + state 기반 멱등 → 중복 발행 없음.
    # 08:37 발행 → 카톡으로 대표 선검토 → publ 그룹톡·아티클 (2026-08-19 변경)
    - cron: '37 23 * * 5'  # KST 토 08:37 (1차)
    - cron: '7 0 * * 6'    # KST 토 09:07 (백업1)
    - cron: '47 0 * * 6'   # KST 토 09:47 (백업2)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: molit-weekly
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      # 'true' 로 바꾸면 발행 직후 publ 그룹톡·아티클까지 검토 없이 전자동.
      # 파일럿 기간에는 'false' - 카톡으로 대표가 먼저 확인한 뒤 수동 실행.
      AUTO_PUBL: 'false'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: claude-sonnet-4-6
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      # 국토부가 GitHub 러너(해외 IP)를 차단하므로 Cloudflare Worker 경유
      MOLIT_PROXY_URL: https://molit-proxy.rabbit-habbit.workers.dev
      MOLIT_PROXY_TOKEN: ${{ secrets.MOLIT_PROXY_TOKEN }}
      LINK_SIGN_KEY: ${{ secrets.LINK_SIGN_KEY }}
      # 뉴스레터 (네이버 SMTP + 구글시트 명단)
      NAVER_SMTP_USER: ${{ secrets.NAVER_SMTP_USER }}
      NAVER_SMTP_PASSWORD: ${{ secrets.NAVER_SMTP_PASSWORD }}
      NEWSLETTER_SHEET_CSV_URL: ${{ secrets.NEWSLETTER_SHEET_CSV_URL }}
      # 조회수 기준·스캔 범위 조정은 여기서
      VIEW_THRESHOLD: '3000'
      SCAN_PAGES: '12'
      MAX_ITEMS_PER_RUN: '7'
      # 등록 7일 이내 신선한 글은 2,000회만 넘으면 게재 (조회수 축적 지연 보정)
      FRESH_DAYS: '7'
      FRESH_THRESHOLD: '2000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check existing archive (발행 여부 판정용)
        id: pre
        run: |
          TODAY=$(date +%F)
          if [ -f "docs/archive/${TODAY}.html" ]; then
            echo "existed=true" >> "$GITHUB_OUTPUT"
          else
            echo "existed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline (scan → select → PDF → Claude → render → push)
        run: python pipeline/run.py --push

      - name: Detect publish
        id: pub
        run: |
          TODAY=$(date +%F)
          if [ "${{ steps.pre.outputs.existed }}" = "false" ] && [ -f "docs/archive/${TODAY}.html" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "✓ ${TODAY} 신규 발행"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  신규 발행 없음 (이미 발행됐거나 대상 없음) · 후속 publ 트리거 생략"
          fi

      - name: Trigger publ workflows (AUTO_PUBL=true 일 때만)
        if: env.AUTO_PUBL == 'true' && steps.pub.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publ-post.yml --repo ${{ github.repository }}
          echo "✓ publ-post 트리거 (publ-article은 publ-post 완료 시 체이닝)"

      - name: Upload intermediate JSONs as artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
