# 경제 브리핑(손경제 Daily) 전용 워커.
# 같은 worker.js를 쓰되 app 코드 k(/brief/k/...)만 서빙한다.
#
# ★ [triggers] cron 없음 - cron은 국토부 발행 디스패치용이라 여기 두면
#   주간 발행이 두 번 돈다.
# ★ WAITLIST KV 바인딩 없음 - 대기명단은 국토부 전용 기능.
#   (/waitlist 경로로 트래픽이 오지 않으므로 문제 없음)
#
# 배포:  cd proxy-worker && npx wrangler deploy -c wrangler.economy.toml
# 시크릿: npx wrangler secret put LINK_SIGN_KEY -c wrangler.economy.toml
#         ※ policy-proxy와 반드시 같은 값이어야 서명이 검증된다

name = "economy-proxy"
main = "worker.js"
compatibility_date = "2026-07-01"

# 상위 퍼널 클릭 기록 (/r 리다이렉터).
# 이 바인딩이 없으면 /r은 기록만 건너뛰고 리다이렉트는 정상 동작한다.
# 링크가 죽는 것보다 통계 1건을 잃는 쪽이 싸기 때문이다.
#
# 준비:
#   npx wrangler d1 create rh-clicks            → 나온 database_id를 아래에 붙인다
#   npx wrangler d1 execute rh-clicks --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "rh-clicks"
database_id = "84cf8d33-b663-47ea-984b-23450615e93a"
