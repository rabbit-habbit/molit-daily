# 구 molit-proxy 유예 배포용 (2026-08-20 개편).
#
# 이미 발송된 링크(TTL 5일)가 살아 있어야 해서 워커 자체는 남긴다.
# 단 cron은 policy-proxy로 옮겼으므로 여기서 반드시 제거한다.
# 그대로 두면 8/22 국토부 발행이 두 번 디스패치된다.
#
# 배포:   cd proxy-worker && npx wrangler deploy -c wrangler.legacy.toml
# 폐기:   5일 경과 후 npx wrangler delete --name molit-proxy
#         (2026-08-25 이후. 그전 발송분의 서명 링크가 모두 만료된 뒤)

name = "molit-proxy"
main = "worker.js"
compatibility_date = "2026-07-01"

[[kv_namespaces]]
binding = "WAITLIST"
id = "4548772c705e4c20a79b6da8397cb7f3"
